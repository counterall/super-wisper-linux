[package]
name = "osw-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
osw-core.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
serde_json = "1"
log.workspace = true
env_logger = "0.11"
