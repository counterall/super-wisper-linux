[package]
name = "osw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["vulkan"]
# The whisper.cpp engine; config, history and the model catalog work without it.
engine = ["dep:whisper-rs"]
vulkan = ["engine", "whisper-rs/vulkan"]
cuda = ["engine", "whisper-rs/cuda"]

[dependencies]
whisper-rs = { version = "0.16", features = ["log_backend"], optional = true }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "isomp4", "aac", "alac", "adpcm"] }
rubato = "0.16"
autocorrect = "2.14"
serde = { version = "1", features = ["derive"] }
directories = "6"
thiserror = "2"
toml = "1"
ureq = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
hound = "3.5"
log.workspace = true

[[test]]
name = "vad_parity"
required-features = ["engine"]
